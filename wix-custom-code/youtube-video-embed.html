<!--
  Custom YouTube embed for Wix Studio.

  Where to paste this:
  Wix Studio editor -> Add Elements -> Embed & Social -> Custom Embeds -> "Embed a Widget"
  (an HTML iframe element) -> click the element -> Enter Code -> paste this whole file.

  Setup:
  1. Video ID is already set to GESq_lsuT7A. To swap it later, replace the
     VIDEO_ID value in the <script> block below (the part after "v=" in a
     youtube.com/watch?v=... URL, or after youtu.be/).
  2. --radius and --accent below are set to reasonable defaults -- adjust to
     match your site's actual corner radius and brand accent color.
  3. On the Wix canvas, resize the embed element itself to the video's aspect
     ratio (e.g. 16:9) -- the widget fills whatever box Wix gives it.

  Native YouTube controls only come as all-or-nothing (controls=0 or controls=1),
  so this hides them completely and reimplements just a play/pause button and a
  seekable progress bar using the YouTube IFrame Player API (postMessage-based,
  no server calls, works inside Wix's sandboxed embed iframe).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --radius: 12px;       /* match your site's corner radius */
    --accent: #2b6cb0;    /* progress bar fill / play button accent */
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
  }
  .rf-yt-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100px;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
  }
  .rf-yt-wrap #rf-yt-player,
  .rf-yt-wrap #rf-yt-player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .rf-yt-playbtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.9);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
    transition: transform 0.15s ease, background 0.15s ease;
    padding: 0;
  }
  .rf-yt-playbtn:hover {
    transform: translate(-50%, -50%) scale(1.08);
    background: rgba(0, 0, 0, 0.7);
  }
  .rf-yt-playbtn svg {
    display: block;
  }
  .rf-yt-playbtn .icon-pause {
    display: none;
  }
  .rf-yt-wrap.is-playing .rf-yt-playbtn .icon-play {
    display: none;
  }
  .rf-yt-wrap.is-playing .rf-yt-playbtn .icon-pause {
    display: block;
  }
  .rf-yt-progress-track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 6px;
    background: rgba(255, 255, 255, 0.25);
    cursor: pointer;
    z-index: 3;
  }
  .rf-yt-progress-track:hover {
    height: 9px;
  }
  .rf-yt-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    pointer-events: none;
  }
  .rf-yt-progress-handle {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="rf-yt-wrap" class="rf-yt-wrap">
    <div id="rf-yt-player"></div>

    <button id="rf-yt-playbtn" class="rf-yt-playbtn" aria-label="Play or pause video" type="button">
      <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
    </button>

    <div id="rf-yt-progress-track" class="rf-yt-progress-track">
      <div id="rf-yt-progress-fill" class="rf-yt-progress-fill"></div>
      <div id="rf-yt-progress-handle" class="rf-yt-progress-handle"></div>
    </div>
  </div>

<script>
(function () {
  var VIDEO_ID = 'GESq_lsuT7A';

  var wrap = document.getElementById('rf-yt-wrap');
  var playBtn = document.getElementById('rf-yt-playbtn');
  var track = document.getElementById('rf-yt-progress-track');
  var fill = document.getElementById('rf-yt-progress-fill');
  var handle = document.getElementById('rf-yt-progress-handle');

  var player = null;
  var progressTimer = null;
  var seeking = false;

  function loadYouTubeAPI(onReady) {
    if (window.YT && window.YT.Player) {
      onReady();
      return;
    }
    var existing = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (typeof existing === 'function') existing();
      onReady();
    };
    if (!document.getElementById('rf-yt-iframe-api')) {
      var tag = document.createElement('script');
      tag.id = 'rf-yt-iframe-api';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
  }

  function createPlayer() {
    player = new YT.Player('rf-yt-player', {
      videoId: VIDEO_ID,
      playerVars: {
        controls: 0,
        disablekb: 1,
        modestbranding: 1,
        rel: 0,
        fs: 0,
        iv_load_policy: 3,
        playsinline: 1
      },
      events: {
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      wrap.classList.add('is-playing');
      startProgressTimer();
    } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
      wrap.classList.remove('is-playing');
      stopProgressTimer();
    }
  }

  function startProgressTimer() {
    stopProgressTimer();
    progressTimer = setInterval(updateProgress, 250);
  }

  function stopProgressTimer() {
    if (progressTimer) {
      clearInterval(progressTimer);
      progressTimer = null;
    }
  }

  function updateProgress() {
    if (!player || seeking || typeof player.getDuration !== 'function') return;
    var duration = player.getDuration();
    if (!duration) return;
    setProgress(player.getCurrentTime() / duration);
  }

  function setProgress(ratio) {
    var pct = Math.min(1, Math.max(0, ratio)) * 100;
    fill.style.width = pct + '%';
    handle.style.left = pct + '%';
  }

  function togglePlay() {
    if (!player || typeof player.getPlayerState !== 'function') return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }

  function ratioFromEvent(evt) {
    var rect = track.getBoundingClientRect();
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    return (clientX - rect.left) / rect.width;
  }

  function seekFromEvent(evt) {
    var ratio = ratioFromEvent(evt);
    setProgress(ratio);
    if (player && player.getDuration) {
      player.seekTo(ratio * player.getDuration(), true);
    }
  }

  playBtn.addEventListener('click', function (evt) {
    evt.stopPropagation();
    togglePlay();
  });

  track.addEventListener('mousedown', function (evt) {
    seeking = true;
    seekFromEvent(evt);
    function onMove(e) { seekFromEvent(e); }
    function onUp(e) {
      seekFromEvent(e);
      seeking = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  track.addEventListener('touchstart', function (evt) {
    seeking = true;
    seekFromEvent(evt);
  });
  track.addEventListener('touchmove', function (evt) {
    seekFromEvent(evt);
  });
  track.addEventListener('touchend', function () {
    seeking = false;
  });

  loadYouTubeAPI(createPlayer);
})();
</script>

</body>
</html>
